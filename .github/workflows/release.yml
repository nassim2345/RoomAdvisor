name: Desktop release

# Crea gli installer dell'app desktop per Windows, macOS e Linux.
#
# - Push di un tag "v*" (es. v0.2.0): compila e pubblica gli installer in una
#   Release di GitHub con quel nome. La versione dell'app viene presa dal tag.
# - Avvio manuale (Actions → Desktop release → Run workflow): compila soltanto
#   e allega gli installer all'esecuzione come artifact, senza pubblicare.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Versione dal tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build server
        run: npm run desktop:prepare
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Installer + pubblicazione
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Installer (senza pubblicare)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: RoomAdvisor-${{ runner.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.AppImage
            dist-desktop/*.deb
          if-no-files-found: error
