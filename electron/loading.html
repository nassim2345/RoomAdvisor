<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>RoomAdvisor</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background: #FAF7F2; color: #6B645A;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      img { width: 88px; height: 88px; }
      .spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 3px solid #E5DDD0; border-top-color: #2A2622;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <img src="../build/icon.png" alt="" />
    <div class="spinner" aria-hidden="true"></div>
    <p>Avvio di RoomAdvisor…</p>
  </body>
</html>
